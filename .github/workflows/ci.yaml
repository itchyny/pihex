name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail {0}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          - os: linux
            runs-on: ubuntu-latest
            targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu
          - os: darwin
            runs-on: macos-latest
            targets: x86_64-apple-darwin aarch64-apple-darwin
          - os: windows
            runs-on: windows-latest
            targets: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
      TARGETS: ${{ matrix.targets }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.pull_request.head.sha || github.sha }}
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Install target toolchains
        run: |
          read -ra targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
      - name: Install cross-compiler for arm64 on Linux
        if: matrix.os == 'linux'
        run: sudo apt-get install gcc-aarch64-linux-gnu
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2.9.3
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test
      - name: Build
        run: |
          read -ra targets <<< "$TARGETS"
          cargo build --release "${targets[@]/#/--target=}"
      - name: Build artifacts
        run: |
          name=${GITHUB_REPOSITORY#*/}
          read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            executable=target/$target/release/$name
            if [[ $OS == darwin || $target == x86_64-* ]]; then
              "$executable" --version
            fi
            artifact=$name-$VERSION-$target
            mkdir "$artifact"
            cp README.md LICENSE "_$name" "$executable" "$artifact"
            if [[ $OS == windows ]]; then
              powershell Compress-Archive -Path "$artifact" -DestinationPath "$artifact.zip"
            else
              zip -r "$artifact.zip" "$artifact"
            fi
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ github.event.repository.name }}_${{ matrix.os }}
          path: '*.zip'

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        run: |
          cd artifacts
          sha256sum -- *.zip > "${GITHUB_REPOSITORY#*/}-$GITHUB_REF_NAME-checksums.txt"
      - name: Create release
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Release $GITHUB_REF_NAME" --notes "" artifacts/*
        env:
          GH_TOKEN: ${{ github.token }}
